<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiendita Coreana | Productos de K-Beauty</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-top">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <a href="index.html" class="logo">Tiendita<span>Coreana</span></a>

        <div class="search-wrapper flex-grow-1 mx-md-4">
          <div class="input-group">
            <input type="text" class="form-control" id="searchInput" placeholder="Buscar productos, marcas o categorías..." aria-label="Buscar">
            <button class="btn btn-dark" type="button" id="searchBtn"><i class="fas fa-search"></i></button>
          </div>
        </div>

        <div class="header-icons d-flex align-items-center gap-3">
          <a href="index.html" title="Inicio"><i class="fas fa-home"></i></a>
          <a href="carrito.html" title="Carrito" class="position-relative">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </a>
        </div>
      </div>
    </div>

    <!-- NAV CATEGORIES -->
    <nav class="main-nav">
      <div class="container">
        <ul class="nav-menu" id="navMenu">
          <li class="nav-item">
            <button class="nav-link-custom" data-filter="all">Todos</button>
          </li>
          <li class="nav-item">
            <button class="nav-link-custom">Cuidado de la Piel <i class="fas fa-chevron-down ms-1" style="font-size:0.7rem"></i></button>
            <div class="dropdown-menu-custom">
              <a href="#" data-filter="Cremas Hidratantes">Cremas Hidratantes</a>
              <a href="#" data-filter="Limpiadores Faciales">Limpiadores Faciales</a>
              <a href="#" data-filter="Sérums Faciales">Sérums Faciales</a>
              <a href="#" data-filter="Tónicos Faciales">Tónicos Faciales</a>
              <a href="#" data-filter="Protectores Solares">Protectores Solares</a>
              <a href="#" data-filter="Esencias">Esencias</a>
              <a href="#" data-filter="Mascarillas">Mascarillas</a>
            </div>
          </li>
          <li class="nav-item">
            <button class="nav-link-custom">Más Belleza <i class="fas fa-chevron-down ms-1" style="font-size:0.7rem"></i></button>
            <div class="dropdown-menu-custom">
              <a href="#" data-filter="Labios">Labios</a>
              <a href="#" data-filter="Bases de Maquillaje">Bases de Maquillaje</a>
            </div>
          </li>
          <li class="nav-item">
            <button class="nav-link-custom">Marcas <i class="fas fa-chevron-down ms-1" style="font-size:0.7rem"></i></button>
            <div class="dropdown-menu-custom">
              <a href="#" data-filter-marca="Anua">Anua</a>
              <a href="#" data-filter-marca="Beauty of Joseon">Beauty of Joseon</a>
              <a href="#" data-filter-marca="COSRX">COSRX</a>
              <a href="#" data-filter-marca="I'm from">I'm from</a>
              <a href="#" data-filter-marca="iUNIK">iUNIK</a>
              <a href="#" data-filter-marca="romand">romand</a>
              <a href="#" data-filter-marca="LANEIGE">LANEIGE</a>
              <a href="#" data-filter-marca="Dr. Althea">Dr. Althea</a>
              <a href="#" data-filter-marca="celimax">celimax</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar" style="display:none;">
    <div class="container">
      <div class="filter-chips" id="filterChips">
        <span class="results-count" id="resultsCount"></span>
      </div>
    </div>
  </div>

  <!-- PRODUCTS -->
  <main class="products-section">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h4 mb-0 fw-bold" id="sectionTitle">Todos los productos</h1>
        <div class="d-flex align-items-center gap-2">
          <label class="small text-muted">Ordenar:</label>
          <select class="form-select form-select-sm" id="sortSelect" style="width:auto;">
            <option value="default">Destacados</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
            <option value="name">Nombre A-Z</option>
          </select>
        </div>
      </div>
      <div class="products-grid" id="productsContainer">
        <div class="loading-state">
          <i class="fas fa-spinner fa-spin"></i>
          <p>Cargando productos...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- PRODUCT MODAL -->
  <div id="productModal" class="product-modal-overlay"></div>

  <!-- GALLERY MODAL -->
  <div id="galleryModal" class="gallery-modal-overlay"></div>

  <!-- TOAST -->
  <div class="toast-container-custom" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // =================== CONFIG ===================
    const CARRITO_KEY = 'carrito_belleza_coreana';
    const TASA_CAMBIO = 7.70;

    let todosProductos = [];
    let productosFiltrados = [];
    let filtroActual = { tipo: 'all', valor: null };
    let terminoBusqueda = '';

    // =================== LOAD PRODUCTS ===================
    async function cargarProductos() {
      try {
        const res = await fetch('products.json?v=' + Date.now());
        if (!res.ok) throw new Error('No se pudo cargar products.json');
        const data = await res.json();
        todosProductos = data.productos || [];
        productosFiltrados = [...todosProductos];
        aplicarFiltrosYMostrar();
        actualizarContadorCarrito();
      } catch (err) {
        console.error(err);
        document.getElementById('productsContainer').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Error al cargar productos</h3>
            <p>${err.message}</p>
            <button class="btn btn-dark mt-3" onclick="cargarProductos()">Reintentar</button>
          </div>`;
      }
    }

    // =================== FILTERS & SEARCH ===================
    function setFiltro(tipo, valor) {
      filtroActual = { tipo, valor };
      terminoBusqueda = '';
      document.getElementById('searchInput').value = '';
      aplicarFiltrosYMostrar();
      updateNavActive(tipo, valor);
    }

    function aplicarFiltrosYMostrar() {
      let lista = [...todosProductos];

      // Filtro de categoría o marca
      if (filtroActual.tipo === 'categoria' && filtroActual.valor) {
        lista = lista.filter(p => p.categoria && p.categoria.includes(filtroActual.valor));
      } else if (filtroActual.tipo === 'marca' && filtroActual.valor) {
        lista = lista.filter(p => p.marca && p.marca.toLowerCase() === filtroActual.valor.toLowerCase());
      }

      // Búsqueda
      if (terminoBusqueda) {
        const t = terminoBusqueda.toLowerCase();
        lista = lista.filter(p =>
          (p.nombre && p.nombre.toLowerCase().includes(t)) ||
          (p.marca && p.marca.toLowerCase().includes(t)) ||
          (p.categoria && p.categoria.toLowerCase().includes(t)) ||
          (p.descripcion && p.descripcion.toLowerCase().includes(t))
        );
      }

      // Orden
      const sort = document.getElementById('sortSelect').value;
      if (sort === 'price-asc') lista.sort((a, b) => a.precio - b.precio);
      else if (sort === 'price-desc') lista.sort((a, b) => b.precio - a.precio);
      else if (sort === 'name') lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
      else lista.sort((a, b) => (b.destacado ? 1 : 0) - (a.destacado ? 1 : 0));

      productosFiltrados = lista;
      mostrarProductos();
      actualizarFilterBar();
    }

    function buscar() {
      terminoBusqueda = document.getElementById('searchInput').value.trim();
      filtroActual = { tipo: 'all', valor: null };
      updateNavActive('all', null);
      aplicarFiltrosYMostrar();
    }

    function updateNavActive(tipo, valor) {
      document.querySelectorAll('.nav-link-custom').forEach(el => el.classList.remove('active'));
      if (tipo === 'all') {
        const btn = document.querySelector('[data-filter="all"]');
        if (btn) btn.classList.add('active');
      }
    }

    function actualizarFilterBar() {
      const bar = document.getElementById('filterBar');
      const chips = document.getElementById('filterChips');
      const count = document.getElementById('resultsCount');
      const title = document.getElementById('sectionTitle');

      let label = 'Todos los productos';
      let showBar = false;

      if (filtroActual.tipo === 'categoria' && filtroActual.valor) {
        label = filtroActual.valor;
        showBar = true;
      } else if (filtroActual.tipo === 'marca' && filtroActual.valor) {
        label = 'Marca: ' + filtroActual.valor;
        showBar = true;
      }
      if (terminoBusqueda) {
        label = `Resultados para "${terminoBusqueda}"`;
        showBar = true;
      }

      title.textContent = label;
      count.textContent = `${productosFiltrados.length} producto${productosFiltrados.length !== 1 ? 's' : ''}`;

      if (showBar) {
        bar.style.display = 'block';
        chips.innerHTML = `
          <span class="filter-chip active">
            ${label}
            <button class="btn-close-chip border-0 bg-transparent text-white" onclick="limpiarFiltros()" aria-label="Quitar filtro">×</button>
          </span>
          <span class="results-count ms-auto">${productosFiltrados.length} producto${productosFiltrados.length !== 1 ? 's' : ''}</span>
        `;
      } else {
        bar.style.display = 'none';
      }
    }

    function limpiarFiltros() {
      filtroActual = { tipo: 'all', valor: null };
      terminoBusqueda = '';
      document.getElementById('searchInput').value = '';
      document.getElementById('sortSelect').value = 'default';
      updateNavActive('all', null);
      aplicarFiltrosYMostrar();
    }

    // =================== RENDER PRODUCTS ===================
    function getColorClass(categoria) {
      if (!categoria) return 'color-default';
      if (categoria.includes('Sérum')) return 'color-serums';
      if (categoria.includes('Crema')) return 'color-cremas';
      if (categoria.includes('Limpieza') || categoria.includes('Limpiador')) return 'color-limpieza';
      if (categoria.includes('Esencia')) return 'color-esencias';
      if (categoria.includes('Mascarilla')) return 'color-mascarillas';
      if (categoria.includes('Tónico')) return 'color-tonicos';
      if (categoria.includes('Solar') || categoria.includes('Protector')) return 'color-solares';
      if (categoria.includes('Labio')) return 'color-labios';
      return 'color-default';
    }

    function mostrarProductos() {
      const container = document.getElementById('productsContainer');
      if (!productosFiltrados.length) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            <h3>No se encontraron productos</h3>
            <p>Intenta con otros términos o quita los filtros</p>
            <button class="btn btn-outline-dark mt-3" onclick="limpiarFiltros()">Ver todos</button>
          </div>`;
        return;
      }

      container.innerHTML = productosFiltrados.map(p => {
        const img = (p.imagenes && p.imagenes[0]) ? p.imagenes[0] : null;
        const color = getColorClass(p.categoria);
        return `
          <div class="product-card" data-id="${p.id}" onclick="abrirModal(${p.id})">
            <div class="product-card-image">
              ${img
                ? `<img src="${img}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                   <div class="image-placeholder ${color}" style="display:none">${p.marca}</div>`
                : `<div class="image-placeholder ${color}">${p.marca}</div>`
              }
            </div>
            <div class="product-card-info">
              <div class="product-card-brand">${p.marca}</div>
              <h3 class="product-card-title">${p.nombre}</h3>
              <div class="product-card-price">US$ ${p.precio.toFixed(2)}</div>
              <button class="btn-add" onclick="event.stopPropagation(); agregarAlCarrito(${p.id}, this)">
                Agregar a la cesta
              </button>
            </div>
          </div>`;
      }).join('');
    }

    // =================== CART ===================
    function cargarCarrito() {
      try {
        const raw = localStorage.getItem(CARRITO_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function guardarCarrito(carrito) {
      localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito));
    }

    function actualizarContadorCarrito() {
      const carrito = cargarCarrito();
      const total = carrito.reduce((s, i) => s + (i.cantidad || 0), 0);
      document.querySelectorAll('.cart-badge').forEach(b => {
        b.textContent = total;
        b.style.display = total > 0 ? 'flex' : 'none';
      });
      return total;
    }

    function agregarAlCarrito(productId, btn) {
      const producto = todosProductos.find(p => p.id === productId);
      if (!producto) return;

      let carrito = cargarCarrito();
      const idx = carrito.findIndex(i => i.id === productId);

      if (idx !== -1) {
        if (carrito[idx].cantidad >= 99) {
          showToast('Máximo 99 unidades por producto', false);
          return;
        }
        carrito[idx].cantidad += 1;
      } else {
        carrito.push({ id: productId, cantidad: 1 });
      }

      guardarCarrito(carrito);
      actualizarContadorCarrito();

      if (btn) {
        btn.classList.add('added');
        btn.textContent = '¡Agregado!';
        setTimeout(() => {
          btn.classList.remove('added');
          btn.textContent = 'Agregar a la cesta';
        }, 900);
      }

      showToast(`${producto.marca} agregado al carrito`);
    }

    function showToast(msg, success = true) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast-custom' + (success ? ' success' : '');
      toast.innerHTML = `<i class="fas fa-${success ? 'check-circle' : 'info-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2800);
    }

    // =================== MODAL ===================
    function abrirModal(id) {
      const p = todosProductos.find(x => x.id === id);
      if (!p) return;

      const img = (p.imagenes && p.imagenes[0]) ? p.imagenes[0] : null;
      const color = getColorClass(p.categoria);
      const numImgs = (p.imagenes && p.imagenes.length) || 0;

      const html = `
        <div class="product-modal">
          <button class="modal-close" onclick="cerrarModal()">×</button>
          <div class="modal-body-custom">
            <div class="modal-product-grid">
              <div class="modal-image-box ${color}" onclick="abrirGaleria(${p.id})">
                ${img
                  ? `<img src="${img}" alt="${p.nombre}" onerror="this.style.display='none'">`
                  : `<div class="image-placeholder">${p.marca}</div>`
                }
              </div>
              <div>
                <div class="product-card-brand mb-1">${p.marca}</div>
                <h2 class="modal-product-title">${p.nombre}</h2>
                <div class="modal-product-price">US$ ${p.precio.toFixed(2)}</div>
                <p class="modal-meta"><strong>Categoría:</strong> ${p.categoria || '—'}</p>
                <div class="modal-actions">
                  <button class="btn btn-outline-secondary" onclick="abrirGaleria(${p.id})"><i class="fas fa-images"></i> Ver imagen${numImgs > 1 ? 'es (' + numImgs + ')' : ''}</button>
                  <button class="btn-add" style="width:auto;padding:10px 24px" onclick="agregarAlCarrito(${p.id}); cerrarModal();">Agregar a la cesta</button>
                </div>
                <div class="modal-description">
                  <h4>Descripción</h4>
                  <p>${p.descripcion || 'Sin descripción disponible.'}</p>
                  ${p.detalles ? `<h4 style="margin-top:14px">Detalles</h4><p>${p.detalles}</p>` : ''}
                  ${p.ingredientes ? `<h4 style="margin-top:14px">Ingredientes</h4><p>${p.ingredientes}</p>` : ''}
                </div>
              </div>
            </div>
          </div>
        </div>`;

      const overlay = document.getElementById('productModal');
      overlay.innerHTML = html;
      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';

      overlay.onclick = e => { if (e.target === overlay) cerrarModal(); };
    }

    function cerrarModal() {
      document.getElementById('productModal').style.display = 'none';
      document.body.style.overflow = '';
    }

    // =================== GALLERY (fullscreen + swipe) ===================
    let galleryTouchStartX = 0;
    let galleryTouchStartY = 0;

    function abrirGaleria(id) {
      const p = todosProductos.find(x => x.id === id);
      if (!p) return;

      // Fallback: if no images array, create one placeholder from brand
      let imgs = (p.imagenes && p.imagenes.length) ? p.imagenes : [];
      if (!imgs.length) {
        const color = getColorClass(p.categoria).replace('color-', '');
        const hex = { serums:'e6f0f7', cremas:'f7e6e6', limpieza:'e6f7e9', esencias:'f7e6f7',
                      mascarillas:'f0e6f7', tonicos:'e6f4f7', solares:'fff7e6', labios:'f7e6f0', default:'f5f5f5' }[color] || 'f5f5f5';
        imgs = [`https://via.placeholder.com/800x800/${hex}/333333?text=${encodeURIComponent(p.marca)}`];
      }

      cerrarModal();

      const html = `
        <div class="gallery-modal">
          <button class="gallery-close" onclick="cerrarGaleria()" aria-label="Cerrar">×</button>
          <div class="gallery-main" id="galleryMainArea">
            <img src="${imgs[0]}" id="galleryMainImg" alt="${p.nombre}" draggable="false">
            <div class="gallery-counter" id="galleryCounter">1 / ${imgs.length}</div>
            ${imgs.length > 1 ? `
              <button class="gallery-nav gallery-prev" onclick="cambiarImg(-1)" aria-label="Anterior">‹</button>
              <button class="gallery-nav gallery-next" onclick="cambiarImg(1)" aria-label="Siguiente">›</button>
            ` : ''}
          </div>
          ${imgs.length > 1 ? `
            <div class="gallery-thumbs" id="galleryThumbs">
              ${imgs.map((src, i) => `
                <div class="thumb ${i === 0 ? 'active' : ''}" onclick="irAImg(${i})">
                  <img src="${src}" alt="Vista ${i+1}" loading="lazy" draggable="false">
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>`;

      const overlay = document.getElementById('galleryModal');
      overlay.innerHTML = html;
      overlay.style.display = 'flex';
      overlay.dataset.imgs = JSON.stringify(imgs);
      overlay.dataset.idx = '0';
      document.body.style.overflow = 'hidden';
      document.body.style.touchAction = 'none';

      // Close only when clicking the dark background (not the image/controls)
      overlay.onclick = e => {
        if (e.target === overlay || e.target.classList.contains('gallery-modal')) {
          cerrarGaleria();
        }
      };

      // Touch swipe support
      const mainArea = document.getElementById('galleryMainArea');
      if (mainArea && imgs.length > 1) {
        mainArea.addEventListener('touchstart', onGalleryTouchStart, { passive: true });
        mainArea.addEventListener('touchend', onGalleryTouchEnd, { passive: true });
      }
    }

    function onGalleryTouchStart(e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      galleryTouchStartX = e.changedTouches[0].screenX;
      galleryTouchStartY = e.changedTouches[0].screenY;
    }

    function onGalleryTouchEnd(e) {
      if (!e.changedTouches || !e.changedTouches[0]) return;
      const dx = e.changedTouches[0].screenX - galleryTouchStartX;
      const dy = e.changedTouches[0].screenY - galleryTouchStartY;
      // Only horizontal swipes (ignore vertical scroll-ish gestures)
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
      if (dx < 0) cambiarImg(1);   // swipe left → next
      else cambiarImg(-1);         // swipe right → prev
    }

    function cerrarGaleria() {
      const overlay = document.getElementById('galleryModal');
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      document.body.style.overflow = '';
      document.body.style.touchAction = '';
    }

    function cambiarImg(dir) {
      const overlay = document.getElementById('galleryModal');
      if (!overlay || overlay.style.display === 'none') return;
      const imgs = JSON.parse(overlay.dataset.imgs || '[]');
      if (imgs.length < 2) return;
      let idx = parseInt(overlay.dataset.idx || '0', 10) + dir;
      if (idx < 0) idx = imgs.length - 1;
      if (idx >= imgs.length) idx = 0;
      irAImg(idx);
    }

    function irAImg(idx) {
      const overlay = document.getElementById('galleryModal');
      const imgs = JSON.parse(overlay.dataset.imgs || '[]');
      if (idx < 0 || idx >= imgs.length) return;

      const main = document.getElementById('galleryMainImg');
      if (main) {
        // Change image without opacity fade (avoids dark overlay on mobile)
        main.src = imgs[idx];
        main.style.opacity = '1';
      }

      overlay.dataset.idx = String(idx);
      const counter = document.getElementById('galleryCounter');
      if (counter) counter.textContent = `${idx + 1} / ${imgs.length}`;

      document.querySelectorAll('.gallery-thumbs .thumb').forEach((t, i) => {
        t.classList.toggle('active', i === idx);
      });
    }

    // =================== EVENTS ===================
    document.addEventListener('DOMContentLoaded', () => {
      cargarProductos();

      document.getElementById('searchBtn').addEventListener('click', buscar);
      document.getElementById('searchInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') buscar();
      });
      document.getElementById('sortSelect').addEventListener('change', aplicarFiltrosYMostrar);

      // Nav filters
      document.querySelectorAll('[data-filter]').forEach(el => {
        el.addEventListener('click', e => {
          e.preventDefault();
          const val = el.getAttribute('data-filter');
          if (val === 'all') {
            limpiarFiltros();
          } else {
            setFiltro('categoria', val);
          }
        });
      });

      document.querySelectorAll('[data-filter-marca]').forEach(el => {
        el.addEventListener('click', e => {
          e.preventDefault();
          setFiltro('marca', el.getAttribute('data-filter-marca'));
        });
      });

      // ESC close
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          cerrarModal();
          cerrarGaleria();
        }
        if (e.key === 'ArrowLeft') cambiarImg(-1);
        if (e.key === 'ArrowRight') cambiarImg(1);
      });

      // Mobile dropdown toggle
      if ('ontouchstart' in window) {
        document.querySelectorAll('.nav-item').forEach(item => {
          const btn = item.querySelector('.nav-link-custom');
          if (!btn || btn.hasAttribute('data-filter')) return;
          btn.addEventListener('click', e => {
            if (window.innerWidth <= 768) {
              e.preventDefault();
              const dd = item.querySelector('.dropdown-menu-custom');
              document.querySelectorAll('.dropdown-menu-custom').forEach(d => {
                if (d !== dd) d.style.display = 'none';
              });
              dd.style.display = dd.style.display === 'block' ? 'none' : 'block';
            }
          });
        });
        document.addEventListener('click', e => {
          if (!e.target.closest('.nav-item')) {
            document.querySelectorAll('.dropdown-menu-custom').forEach(d => d.style.display = 'none');
          }
        });
      }
    });

    // Global
    window.abrirModal = abrirModal;
    window.cerrarModal = cerrarModal;
    window.abrirGaleria = abrirGaleria;
    window.cerrarGaleria = cerrarGaleria;
    window.cambiarImg = cambiarImg;
    window.irAImg = irAImg;
    window.agregarAlCarrito = agregarAlCarrito;
    window.limpiarFiltros = limpiarFiltros;
    window.cargarProductos = cargarProductos;
  </script>
</body>
