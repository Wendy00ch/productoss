<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito de Compras | Belleza Coreana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER (sin barra de búsqueda / filtros) -->
  <header class="site-header">
    <div class="container header-top">
      <div class="d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo">Belleza<span>Coreana</span></a>

        <div class="header-icons d-flex align-items-center gap-3">
          <a href="index.html" title="Inicio"><i class="fas fa-home"></i></a>
          <a href="carrito.html" title="Carrito" class="position-relative">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge" id="cartBadge">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="carrito-container">
    <div class="carrito-header">
      <h1 class="carrito-title">
        <i class="fas fa-shopping-cart"></i> Carrito de Compras
      </h1>
      <div class="d-flex gap-2 flex-wrap align-items-center">
        <a href="index.html" class="btn-continuar">
          <i class="fas fa-arrow-left"></i> Continuar comprando
        </a>
        <button class="btn-vaciar" id="btnVaciarCarrito" style="display:none;" onclick="vaciarCarrito()">
          <i class="fas fa-trash"></i> Vaciar carrito
        </button>
      </div>
    </div>

    <!-- Vacío -->
    <div id="carritoVacio" class="carrito-vacio" style="display:none;">
      <i class="fas fa-shopping-cart"></i>
      <h2>Tu carrito está vacío</h2>
      <p class="text-muted mb-4">Agrega productos desde la tienda</p>
      <a href="index.html" class="btn-add" style="width:auto; display:inline-block; padding:12px 28px;">
        <i class="fas fa-store"></i> Ver productos
      </a>
    </div>

    <!-- Con productos -->
    <div id="carritoConProductos" class="carrito-content" style="display:none;">
      <div class="carrito-items" id="listaProductos">
        <div class="text-center py-5 text-muted">
          <i class="fas fa-spinner fa-spin fa-2x mb-3"></i>
          <p>Cargando carrito...</p>
        </div>
      </div>

      <div class="resumen-pedido">
        <h2 class="resumen-title">Resumen del Pedido</h2>
        <div class="resumen-detalle">
          <div class="resumen-fila">
            <span class="resumen-label">Subtotal</span>
            <span class="resumen-valor" id="subtotal">US$ 0.00</span>
          </div>
          <div class="resumen-fila">
            <span class="resumen-label">Envío</span>
            <span class="resumen-valor" id="envio" style="color:#28a745;font-weight:600;">GRATIS</span>
          </div>
          <div class="resumen-fila total">
            <span class="resumen-label">Total</span>
            <span class="resumen-valor" id="total">US$ 0.00</span>
          </div>
          <div class="resumen-fila">
            <span class="resumen-label">Total en GTQ</span>
            <span class="resumen-valor resumen-quetzales" id="totalQuetzales">Q 0.00</span>
          </div>
        </div>
        <button class="btn-pagar" onclick="procederPago()">Proceder al pago</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="copyright">© 2026 Belleza Coreana. Todos los derechos reservados.</div>
    </div>
  </footer>

  <div class="toast-container-custom" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const CARRITO_KEY = 'carrito_belleza_coreana';
    const TASA_CAMBIO = 7.70;
    let productosData = [];

    async function cargarProductosData() {
      try {
        const res = await fetch('products.json?v=' + Date.now());
        if (!res.ok) throw new Error('Error cargando productos');
        const data = await res.json();
        productosData = data.productos || [];
        return productosData;
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    function cargarCarrito() {
      try {
        const raw = localStorage.getItem(CARRITO_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }

    function guardarCarrito(carrito) {
      localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito));
    }

    function actualizarContadorCarrito() {
      const carrito = cargarCarrito();
      const total = carrito.reduce((s, i) => s + (i.cantidad || 0), 0);
      document.querySelectorAll('.cart-badge').forEach(b => {
        b.textContent = total;
        b.style.display = total > 0 ? 'flex' : 'none';
      });
      return total;
    }

    function getColorClass(categoria) {
      if (!categoria) return 'color-default';
      if (categoria.includes('Sérum')) return 'color-serums';
      if (categoria.includes('Crema')) return 'color-cremas';
      if (categoria.includes('Limpieza') || categoria.includes('Limpiador')) return 'color-limpieza';
      if (categoria.includes('Esencia')) return 'color-esencias';
      if (categoria.includes('Mascarilla')) return 'color-mascarillas';
      if (categoria.includes('Tónico')) return 'color-tonicos';
      if (categoria.includes('Solar') || categoria.includes('Protector')) return 'color-solares';
      if (categoria.includes('Labio')) return 'color-labios';
      return 'color-default';
    }

    async function renderizarCarrito() {
      const carrito = cargarCarrito();
      const lista = document.getElementById('listaProductos');
      const vacio = document.getElementById('carritoVacio');
      const conProd = document.getElementById('carritoConProductos');
      const btnVaciar = document.getElementById('btnVaciarCarrito');

      if (carrito.length === 0) {
        vacio.style.display = 'block';
        conProd.style.display = 'none';
        if (btnVaciar) btnVaciar.style.display = 'none';
        actualizarContadorCarrito();
        return;
      }

      vacio.style.display = 'none';
      conProd.style.display = 'grid';
      if (btnVaciar) btnVaciar.style.display = 'inline-flex';

      if (!productosData.length) await cargarProductosData();

      let subtotal = 0;
      let html = '';

      for (const item of carrito) {
        const p = productosData.find(x => x.id === item.id);
        if (!p) continue;

        const totalItem = p.precio * item.cantidad;
        subtotal += totalItem;
        const img = (p.imagenes && p.imagenes[0]) ? p.imagenes[0] : null;
        const color = getColorClass(p.categoria);

        html += `
          <div class="carrito-item" data-id="${p.id}">
            <div class="carrito-item-imagen">
              ${img
                ? `<img src="${img}" alt="${p.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                   <div class="image-placeholder ${color}" style="display:none">${p.marca.substring(0,2)}</div>`
                : `<div class="image-placeholder ${color}">${p.marca.substring(0,2)}</div>`
              }
            </div>
            <div class="carrito-item-info">
              <div class="carrito-item-nombre">${p.nombre}</div>
              <div class="carrito-item-marca">${p.marca} • ${p.categoria || ''}</div>
              <div class="carrito-item-cantidad">
                <button class="cantidad-btn" onclick="cambiarCantidad(${p.id}, -1)"><i class="fas fa-minus"></i></button>
                <input type="number" class="cantidad-input" value="${item.cantidad}" min="1" max="99"
                       onchange="actualizarCantidad(${p.id}, this.value)">
                <button class="cantidad-btn" onclick="cambiarCantidad(${p.id}, 1)"><i class="fas fa-plus"></i></button>
              </div>
              <button class="eliminar-item" onclick="eliminarProducto(${p.id})">
                <i class="fas fa-trash"></i> Eliminar
              </button>
            </div>
            <div class="carrito-item-precio">
              <div class="precio-unitario">US$ ${p.precio.toFixed(2)} c/u</div>
              <div class="precio-total">US$ ${totalItem.toFixed(2)}</div>
            </div>
          </div>`;
      }

      lista.innerHTML = html || '<p class="p-4 text-muted">No se pudieron cargar los productos del carrito.</p>';
      actualizarResumen(subtotal);
      actualizarContadorCarrito();
    }

    function actualizarResumen(subtotal) {
      const totalGTQ = subtotal * TASA_CAMBIO;
      document.getElementById('subtotal').textContent = `US$ ${subtotal.toFixed(2)}`;
      document.getElementById('total').textContent = `US$ ${subtotal.toFixed(2)}`;
      document.getElementById('totalQuetzales').textContent = `Q ${totalGTQ.toFixed(2)}`;
    }

    function cambiarCantidad(id, cambio) {
      let carrito = cargarCarrito();
      const idx = carrito.findIndex(i => i.id === id);
      if (idx === -1) return;

      const nueva = carrito[idx].cantidad + cambio;
      if (nueva < 1) {
        eliminarProducto(id);
        return;
      }
      if (nueva > 99) {
        alert('La cantidad máxima por producto es 99');
        return;
      }
      carrito[idx].cantidad = nueva;
      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function actualizarCantidad(id, valor) {
      let carrito = cargarCarrito();
      const idx = carrito.findIndex(i => i.id === id);
      if (idx === -1) return;

      const cantidad = parseInt(valor, 10);
      if (isNaN(cantidad) || cantidad < 1) {
        eliminarProducto(id);
        return;
      }
      if (cantidad > 99) {
        alert('La cantidad máxima por producto es 99');
        renderizarCarrito();
        return;
      }
      carrito[idx].cantidad = cantidad;
      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function eliminarProducto(id) {
      if (!confirm('¿Eliminar este producto del carrito?')) return;
      let carrito = cargarCarrito().filter(i => i.id !== id);
      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function vaciarCarrito() {
      if (!confirm('¿Vaciar todo el carrito?')) return;
      localStorage.removeItem(CARRITO_KEY);
      renderizarCarrito();
    }

    function procederPago() {
      const carrito = cargarCarrito();
      if (!carrito.length) {
        alert('El carrito está vacío');
        return;
      }
      alert('Funcionalidad de pago en desarrollo.\n\nEn una implementación real aquí se procesaría el pago con la pasarela elegida.');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await cargarProductosData();
      await renderizarCarrito();
    });

    window.cambiarCantidad = cambiarCantidad;
    window.actualizarCantidad = actualizarCantidad;
    window.eliminarProducto = eliminarProducto;
    window.vaciarCarrito = vaciarCarrito;
    window.procederPago = procederPago;
  </script>
</body>
</html>
